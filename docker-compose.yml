services:
  immich-server:
    build: ./immich-server
    env_file: .env
    environment:
      - IMMICH_MACHINE_LEARNING_URL=${IMMICH_MACHINE_LEARNING_URL}
      # Immich defaults to expecting its DB host at "database" (matching
      # Immich's own official example compose file's service name). Our
      # Postgres service is named "postgres" instead, so this must be set
      # explicitly or Immich fails with getaddrinfo ENOTFOUND database.
      # Verified against a live deploy 2026-07-07.
      - DB_HOSTNAME=postgres
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - immich_upload:/usr/src/app/upload                              # NAS, via Docker-native NFS volume — thumbnails/previews
      - ./immich-server/rclone.conf:/root/.config/rclone/rclone.conf:ro # local only, not committed
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: docker.io/redis:6.2-alpine
    restart: unless-stopped

  postgres:
    # Verify this tag against Immich's current example compose file for
    # :release before first deploy — extension versions drift with Immich.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data   # local SSD bind mount — never NFS, never a Docker NFS volume
    restart: unless-stopped

  search-api:
    build: ./search-api
    env_file: .env
    environment:
      - IMMICH_URL=http://immich-server:2283
      - IMMICH_DB_DSN=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE_NAME}
    ports:
      - "5000:5000"
    depends_on:
      - immich-server
    restart: unless-stopped

  # Sidecar development container. Same base codebase as search-api (prod),
  # different config AND a different (superset) image build -- prod never
  # sets sidecar-related env vars, never mounts sidecar/, and never installs
  # sidecar/requirements.txt, so it stays completely sidecar-blind. This is
  # where sidecar integration is built and tested; sidecar_dev is
  # wipe-and-redevelop freely (see docs/sidecar-augmentation.md, "Process &
  # infrastructure decisions").
  #
  # build.context is the repo root (not ./search-api like prod), because
  # sidecar/Dockerfile.dev needs to COPY from both search-api/ and sidecar/
  # (specifically sidecar/requirements.txt, for sidecar-only Python deps
  # like duckdb -- see sidecar/Dockerfile.dev for the layer rationale).
  #
  # PYTHONPATH is just /app, NOT /app:/app/sidecar -- sidecar/ is a real
  # package (sidecar/__init__.py) with relative internal imports, so adding
  # /app/sidecar to the path would make its db.py/config.py importable bare
  # again, re-colliding with search-api's own db.py/config.py (the bug that
  # broke the first smoke test run). Invoke enrichment scripts as
  # `python -m sidecar.run_reverse_geocode`, not as a bare script path.
  search-api-dev:
    build:
      context: .
      dockerfile: sidecar/Dockerfile.dev
    env_file: .env
    environment:
      - IMMICH_URL=http://immich-server:2283
      # Individual connection params, not a combined DSN string -- the real
      # Postgres password contains characters (%, !) that a DSN string
      # requires percent-encoding, which this plain env-var interpolation
      # doesn't do. psycopg2.connect(**kwargs) in sidecar/config.py handles
      # these values as literal strings, no encoding needed. Broke a real
      # test run 2026-08; see sidecar/config.py for the fix.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - IMMICH_DB_NAME=${DB_DATABASE_NAME}
      - SIDECAR_DB_NAME=sidecar_dev
      # gpu-ml's generic inference service (object_detect.py). Points at
      # the gpu-ml device's real LAN address -- set the actual value in
      # .env, same pattern as IMMICH_MACHINE_LEARNING_URL above.
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL}
      - PYTHONPATH=/app
    volumes:
      - ./sidecar:/app/sidecar
    ports:
      - "5001:5000"
    depends_on:
      - immich-server
    restart: unless-stopped

volumes:
  # NFS-backed Docker volume — Docker mounts this directly, no host-level
  # /etc/fstab entry needed. Only Immich's own container can see this data;
  # if a future host-side script needs it too, it'll need to run inside a
  # container (e.g. `docker compose run`) mounting the same volume.
  immich_upload:
    driver: local
    driver_opts:
      type: nfs
      device: ":${NAS_THUMBS_PATH}"
      o: "nfsvers=4,addr=${NAS_IP},nolock,soft,rw"
